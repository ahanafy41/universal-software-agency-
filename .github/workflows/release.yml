name: Automated Release & Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.2.0" >> $GITHUB_OUTPUT
          fi

      - name: Package Skill Zip Archive
        run: |
          mkdir -p dist
          zip -r dist/universal-software-agency-${{ steps.vars.outputs.TAG_NAME }}.zip . -x ".git/*" ".github/*" "dist/*"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "${{ steps.vars.outputs.TAG_NAME }} — Universal AI Software Agency"
          body: |
            ## 🌟 Universal AI Software Engineering Agency ${{ steps.vars.outputs.TAG_NAME }}

            ### 🚀 What's New in this Release
            - **Mandatory Pre-Fix Diagnostic & Triage Gate**: Strict prohibition of premature patching. Enforces deep codebase inspection, caller mapping, and turn-by-turn interactive diagnostic discovery before touching any code.
            - **Sequential Section Numbering**: Re-organized and harmonized all 16 engineering protocols into a clean, logical sequence.
            - **Worker Subagent Mandate Isolation**: Clear, independent mandates for Blast-Radius Limiter (`Subagent F`) and Live Web & API Documentation Specialist (`Subagent G`).
            - **Project Architecture & Mental Topology**: Visual Mermaid mindmaps and rapid search index (`project_mindmap.md`).
            - **Strict Code Preservation & Zero-Corruption Invariants**: Blast Radius Limiter and automated pre-mutation backups.
            - **Dual Progress Tracking**: Human Markdown (`debug_tasks.md`) + Machine JSON (`debug_manifest.json`).
          draft: false
          prerelease: false
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}