name: Automated Release & Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v4.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Mechanical Validation & Tests
        run: |
          python3 scripts/validate_code.py --strict --run-tests .

      - name: Package Skill Zip Archive
        run: |
          mkdir -p dist
          zip -r dist/universal-software-agency.zip . -x ".git/*" ".github/*" "dist/*" ".backups/*" "__pycache__/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "${{ steps.vars.outputs.TAG_NAME }} — Universal Socratic Software Engineering Council (v4.1 Lean Powerhouse)"
          body: |
            # 🌐 Universal Socratic Software Engineering Council ${{ steps.vars.outputs.TAG_NAME }} (v4.1 Lean Powerhouse)

            Production-grade autonomous software engineering council operating via AST code mapping, zero-regression bulletproof modifications, active isolated subagents, and strict accessibility standards.

            ---

            ### 🚀 Key Highlights & New Capabilities in v4.1:

            1. **AST Code Mapper & > 95% Token Saver**:
               - Deterministic symbol indexing for Python (AST), Lua, JavaScript/TypeScript, and Shell.
               - Instant call-signature & line-range detection (`--find`) allowing surgical navigation without reading entire files.
               - Benchmarked on production repositories with a net **96.4% token reduction**.

            2. **Bulletproof Feature Modification Protocol (Zero-Regression)**:
               - Enforces reproduction test scripts (RED first) before any mutation.
               - Mandatory blast-radius and caller-hierarchy verification to prevent silent breaking changes in existing features.
               - Automated regression verification ensuring full backward compatibility.

            3. **Unified CLI & Mechanical Validation**:
               - Integrated AST mapping directly into `scripts/validate_code.py` via `--map` and `--find`.
               - Automated mechanical test harness passing 100% assertions in < 0.2s.

            4. **Clean & Lean Architecture**:
               - Zero external dependencies.
               - Fully self-contained specification (`SKILL.md`) in under 200 lines.
               - Full compliance with `agentskills.io` standard.
          draft: false
          prerelease: false
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
