name: Automated Release & Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v2.2.0" >> $GITHUB_OUTPUT
          fi

      - name: Package Skill Zip Archive
        run: |
          mkdir -p dist
          zip -r dist/universal-software-agency.zip . -x ".git/*" ".github/*" "dist/*" ".backups/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "${{ steps.vars.outputs.TAG_NAME }} — Universal AI Software Agency (Lean High-Precision)"
          body: |
            ## 🚀 Universal AI Software Engineering Agency ${{ steps.vars.outputs.TAG_NAME }} (Lean High-Precision Architecture)

            ### 🌟 Major Release Highlights (${{ steps.vars.outputs.TAG_NAME }})
            - **Lean High-Precision Quad Architecture**: Optimized 4-agent workflow (Web & Stack Specialist, Planner, Precision Coder, QA Verification) designed specifically for fast and compact AI models.
            - **Mandatory Live Web Grounding (2026)**: Zero outdated training memory hallucinations — live documentation verification before planning or execution.
            - **Context Isolation & Hard Gatekeepers**: Closed JSON manifests (`project_spec.json`, `debug_manifest.json`, `references_manifest.json`) strictly enforced via AST tooling.
            - **Surgical Code Modifications (Zero Overwrites)**: File-safe line-by-line patching with automated pre-mutation backups (`backup_manager.py`) and blast-radius checking (`diff_verifier.py`).
            - **Universal Screen-Reader & A11y Standards**: Strict output formatting, clean terminal logs, and complete WCAG/ARIA compliance for seamless TalkBack & Jieshuo/CSR workflows.
            - **Antigravity 2.0 & Gemini Ready**: Native skill configuration compatible with all Antigravity CLI and Gemini Agent environments.
          draft: false
          prerelease: false
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
