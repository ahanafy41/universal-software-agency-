name: Automated Release & Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v2.2.0" >> $GITHUB_OUTPUT
          fi

      - name: Package Skill Zip Archive
        run: |
          mkdir -p dist
          zip -r dist/universal-software-agency.zip . -x ".git/*" ".github/*" "dist/*" ".backups/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "${{ steps.vars.outputs.TAG_NAME }} — Universal AI Software Agency"
          body: |
            ## 🚀 Universal AI Software Engineering Agency ${{ steps.vars.outputs.TAG_NAME }} (Full Multi-File Powerhouse & Cross-Platform Agent Ecosystem)

            ### 🌟 Major Release Highlights (${{ steps.vars.outputs.TAG_NAME }})
            - **Complete Multi-File Powerhouse Architecture**: Comprehensive, uncompressed reference playbooks (`project-lifecycle.md`, `diagnostics-and-qa.md`, `craftsmanship-and-devops.md`) and complete unified schema catalog (`agency-schemas.json`).
            - **Full AST & Code Integrity Verification Suite**: Complete multi-language AST parser, JSON schema validator, bracket matcher, and reference symbol ingestion verifier (`validate_code.py`).
            - **Non-Destructive Mutation Engine**: Pre-mutation automated backup manager (`backup_manager.py`) with instant rollback and blast-radius diff verifier (`diff_verifier.py`).
            - **Universal Accessibility (A11y) & Keyboard-First Standards**: Built-in 100% keyboard navigability, semantic ARIA landmarks, and screen-reader optimized terminal logging.
            - **Strict Zero-Skipping Reference Ingestion**: Mandatory extraction of symbol tables and API contracts into `references_manifest.json` before writing code.
            - **Senior Human Software Engineering Standards**: Atomic file I/O, actionable error messages, `--doctor` self-check diagnostic, graceful `SIGINT` handling, structured logging, and failure-mode testing.
            - **Google Antigravity 2.0 & Gemini Compatibility**: Fully compliant YAML frontmatter and unified tool mapping for both Antigravity 2.0 and Gemini Agent environments.
          draft: false
          prerelease: false
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
