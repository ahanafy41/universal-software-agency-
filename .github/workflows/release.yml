name: Automated Release & Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v2.0" >> $GITHUB_OUTPUT
          fi

      - name: Package Skill Zip Archive
        run: |
          mkdir -p dist
          zip -r dist/universal-software-agency-${{ steps.vars.outputs.TAG_NAME }}.zip . -x ".git/*" ".github/*" "dist/*"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "${{ steps.vars.outputs.TAG_NAME }} — Universal AI Software Agency"
          body: |
            ## 🚀 Universal AI Software Engineering Agency ${{ steps.vars.outputs.TAG_NAME }} (Lean & Mean 5-File Architecture)

            ### 🌟 Major Release Highlights (v2.0)
            - **5-File Consolidated Architecture**: Merged 21 fragmented files into 3 powerhouse playbooks (`project-lifecycle.md`, `diagnostics-and-qa.md`, `craftsmanship-and-devops.md`) and 1 unified schema catalog (`agency-schemas.json`), cutting token bloat by over 40% while preserving 100% of capabilities.
            - **Strict Zero-Skipping Reference Ingestion**: Mandatory extraction of symbol tables and API contracts into `references_manifest.json` before writing code, backed by deterministic coverage validation.
            - **6 Pillars of Senior Human Software Engineering**:
              1. **Atomic File I/O**: Temporary file writes + atomic rename to guarantee zero data corruption on crash.
              2. **Actionable Errors & `--doctor` Self-Check**: Clear 3-part diagnostic guidance (What, Why, Fix) and environment prerequisite checks.
              3. **Graceful Shutdown (`SIGINT`) & Clean CLI Ergonomics**: Safe resource disposal on `Ctrl+C` with standard flags.
              4. **Structured Logging**: Standard log levels (`DEBUG`, `INFO`, `WARN`, `ERROR`), eliminating raw unformatted prints.
              5. **Failure-Mode & Edge-Case Testing**: Mandatory simulation of network cuts, disk errors, malformed payloads, and concurrency races.
              6. **Universal Accessibility (A11y)**: Built-in keyboard-first navigation, ARIA landmarks, and screen-reader friendly terminal outputs.
            - **Proactive Live 2026 Google Search Integration**: Mandates live search lookups across all worker subagents (A through I) for modern 2026 API signatures and GitHub Issues triage.
            - **Upgraded Verification Engine (`validate_code.py`)**: Strict AST parser, bracket matcher, JSON schema validator, placeholder inhibitor, and symbol manifest coverage verifier.
          draft: false
          prerelease: false
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}